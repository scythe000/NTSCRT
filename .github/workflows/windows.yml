# Build, test and package VHS-Studio.
#
# Every push and pull request builds the Cargo workspace on a Windows runner,
# runs the tests and uploads the packaged zip as a workflow artifact, so a
# change can be tried without a local MSVC toolchain. A `v*` tag additionally
# attaches the zip to a GitHub Release.

name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    permissions:
      # Only the release step writes, and only on a tag.
      contents: write
    # Job-level so the Sign step's `if` can see them: a step's own `env` is
    # not in scope for its own condition, and the secrets context is not
    # allowed in a step `if` at all. Empty when the secrets are not set.
    env:
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ntsc-rs is the signal stage; slang-shaders is what build.rs packs
          # into the executable (the seven CRT presets and their includes).
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # Authenticode signing, when the repository has a certificate. Without
      # a signature SmartScreen blocks the downloaded exe until it has built
      # up reputation, and every new build starts that over. Add two secrets
      # to turn this on: CODESIGN_PFX_BASE64 (the .pfx, base64-encoded) and
      # CODESIGN_PASSWORD. Nothing here runs when they are absent. signtool
      # comes with the Windows SDK on the runner; the RFC 3161 timestamp keeps
      # the signature valid after the certificate expires.
      - name: Sign
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          foreach ($exe in 'vhs-studio.exe', 'vhs-studio-smoke.exe') {
            & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d 'VHS-Studio' "target\release\$exe"
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
            & $signtool.FullName verify /pa /v "target\release\$exe"
            if ($LASTEXITCODE -ne 0) { throw "verifying $exe failed" }
          }
          Remove-Item $pfx

      - name: Package
        # The build is already done; the script stages target/release, checks
        # the shaders resolve from beside the executable, and zips.
        run: pwsh ./package.ps1 -SkipTests -SkipBuild

      - name: Version string
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object name -eq 'vhs-studio-app').version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: VHS-Studio-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
