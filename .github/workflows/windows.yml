# Build, test and package the Windows port.
#
# Every push and pull request builds the workspace under windows/ on a
# Windows runner, runs the tests and uploads the packaged zip as a workflow
# artifact, so a change can be tried without a local MSVC toolchain. A
# `v*` tag additionally attaches the zip to a GitHub Release.
#
# The macOS build is not covered here: it needs the signing and notarization
# credentials scripts/make-release.sh describes, which do not belong in CI.

name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    permissions:
      # Only the release step writes, and only on a tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # ntsc-rs is the signal stage; slang-shaders is what ships in shaders/.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Package
        # The build is already done; the script stages target/release, checks
        # the shaders resolve from beside the executable, and zips.
        run: pwsh ./package.ps1 -SkipTests -SkipBuild

      - name: Version string
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object name -eq 'ntscrt-app').version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: NTSCRT-${{ steps.version.outputs.version }}-windows-x64
          path: windows/dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.zip
          generate_release_notes: true
