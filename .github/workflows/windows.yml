# Build, test and package VHS-Studio.
#
# Every push and pull request builds the Cargo workspace on a Windows runner,
# runs the tests and uploads the packaged zip as a workflow artifact, so a
# change can be tried without a local MSVC toolchain. A `v*` tag additionally
# attaches the zip to a GitHub Release.

name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    permissions:
      # Only the release step writes, and only on a tag.
      contents: write
    # Job-level so the Sign steps' `if` can see them: a step's own `env` is
    # not in scope for its own condition, and the secrets context is not
    # allowed in a step `if` at all. Empty when the secrets are not set.
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ntsc-rs is the signal stage; slang-shaders is what build.rs packs
          # into the executable (the seven CRT presets and their includes).
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # Authenticode signing. Without a signature SmartScreen blocks the
      # downloaded exe ("Windows protected your PC") until that exact file
      # has built up download reputation, and every new build starts over;
      # signed with one consistent identity, reputation carries from release
      # to release. Nothing here runs until the repository has one of the two
      # sets of secrets below (HANDOFF.md, "Code signing" says how to get
      # them); with neither, the zip ships unsigned and the README warns.
      #
      # Path A — Azure Artifact Signing (the former Trusted Signing). Microsoft's
      # managed service, ~$10/month, no certificate file to keep: the key lives
      # in Azure and the action signs over HTTPS with an App Registration.
      # Secrets: ARTIFACT_SIGNING_ENDPOINT (the region URL, e.g.
      # https://eus.codesigning.azure.net/), ARTIFACT_SIGNING_ACCOUNT,
      # ARTIFACT_SIGNING_PROFILE, AZURE_TENANT_ID, AZURE_CLIENT_ID,
      # AZURE_CLIENT_SECRET.
      - name: Sign (Azure Artifact Signing)
        if: env.ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\vhs-studio.exe
            ${{ github.workspace }}\target\release\vhs-studio-smoke.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VHS-Studio
          description-url: https://github.com/scythe000/VHS-Studio

      # Path B — a certificate file, for an OV/EV certificate whose key may be
      # exported (older ones; since mid-2023 CAs issue new ones on hardware
      # tokens, where this path cannot reach). Secrets: CODESIGN_PFX_BASE64
      # (the .pfx, base64-encoded) and CODESIGN_PASSWORD. signtool comes with
      # the Windows SDK on the runner; the RFC 3161 timestamp keeps the
      # signature valid after the certificate expires.
      - name: Sign (certificate file)
        if: env.ARTIFACT_SIGNING_ENDPOINT == '' && env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          foreach ($exe in 'vhs-studio.exe', 'vhs-studio-smoke.exe') {
            & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d 'VHS-Studio' "target\release\$exe"
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
          }
          Remove-Item $pfx

      # Whichever path ran, the build fails rather than ship an unsigned exe
      # while signing is configured: /pa checks the chain to a trusted root
      # and the timestamp, the way Windows will at install time.
      - name: Check signatures
        if: env.ARTIFACT_SIGNING_ENDPOINT != '' || env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          foreach ($exe in 'vhs-studio.exe', 'vhs-studio-smoke.exe') {
            & $signtool.FullName verify /pa /v "target\release\$exe"
            if ($LASTEXITCODE -ne 0) { throw "$exe is not validly signed" }
          }

      - name: Package
        # The build is already done; the script stages target/release, checks
        # the shaders resolve from beside the executable, and zips.
        run: pwsh ./package.ps1 -SkipTests -SkipBuild

      - name: Version string
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object name -eq 'vhs-studio-app').version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: VHS-Studio-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      # A `vX.Y.Z` tag publishes a Release. The tag has to match the Cargo
      # version (so the zip's name, the About box and the Release agree),
      # and the notes are that version's section of CHANGELOG.md rather than
      # a generated list of every commit.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = '${{ steps.version.outputs.version }}'
          if ($tag -ne "v$v") { throw "tag $tag does not match the Cargo version $v" }
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($v))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## $v' section" }
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          $body -join "`n" | Set-Content -NoNewline (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          Write-Host ($body -join "`n")

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VHS-Studio ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: false
