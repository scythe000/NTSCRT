[package]
name = "vhs-studio-core"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral VHS-Studio pipeline: ntsc-rs signal stage, downscale specs, scanline grid math, colour grade, timeline"
license = "MIT OR ISC OR Apache-2.0"

[dependencies]
ntsc-rs = { path = "../../Vendor/ntsc-rs/crates/ntscrs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
