[package]
name = "vhs-studio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VHS-Studio: ntsc-rs signal emulation, colour grade and RetroArch CRT shaders, on wgpu/egui"

[lib]
name = "vhs_studio_app"
path = "src/lib.rs"

[[bin]]
name = "vhs-studio"
path = "src/main.rs"

[[bin]]
name = "vhs-studio-smoke"
path = "src/bin/smoke.rs"

[dependencies]
vhs-studio-core = { path = "../vhs-studio-core" }

wgpu.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu = "0.36"

# runtime-wgpu gives one shader backend over D3D12/Vulkan, so the chain runs
# on the same device egui already owns.
librashader = { version = "0.12", default-features = false, features = ["runtime-wgpu", "presets", "stable"] }
# ShaderFeatures is not re-exported through the librashader facade in 0.12.
librashader-common = "0.12"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
rfd = "0.15"
# Reading the clipboard for "Paste preset"; egui only writes to it.
arboard = { version = "3", default-features = false }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Unpacks the embedded shader pack (shader_pack.rs). Already in the tree via
# the PNG codec; the default pure-Rust backend.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Linux is a verification target, not a shipping one: the GUI was checked on
# an X11 desktop with Mesa's software Vulkan driver. winit needs a windowing
# backend feature there that Windows doesn't; this adds nothing to the
# Windows build.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11"] }

[build-dependencies]
# Embeds the app icon and marks the binary DPI-aware / per-monitor v2.
winresource = "0.1"
# Turns Assets/icon-source.png into the .ico at build time (see build.rs).
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# Packs the shader closure (see build.rs and src/shader_pack.rs).
flate2 = "1"
